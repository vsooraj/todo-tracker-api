services:
  postgres:
    image: postgres:15-alpine
    container_name: kairos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kairos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kairos_api
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/kairos?schema=public
      CLIENT_ORIGIN: http://localhost:8080
      BASIC_AUTH_EMAIL: demo@todotracker.local
      BASIC_AUTH_PASSWORD: Password123!
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE_URL: http://localhost:5001
    container_name: kairos_client
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
